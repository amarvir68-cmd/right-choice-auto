name: Live production validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p live-check
          cd live-check
          npm init -y
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run live validation
        run: node scripts/live-validation.mjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-validation-artifacts
          path: live-validation-artifacts
          if-no-files-found: warn
